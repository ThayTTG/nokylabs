<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#0F0B1A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F6F4FA" media="(prefers-color-scheme: light)">
<meta property="og:title" content="NokyLabs">
<meta property="og:description" content="Soluções pequenas para problemas reais: utilitários, um app de avaliação e um jogo.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thayttg.github.io/nokylabs/">
<title>NokyLabs</title>
<meta name="description" content="NokyLabs: soluções pequenas para problemas reais. Utilitários, um app de avaliação e um jogo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabeçalho fixo + páginas trocadas por rota (#launcher, #cubebin…), largura máx. 1160px.
   Claro = laranja sobre lilás bem claro · Escuro = roxo do NokyLabs Launcher. */
:root {
  --bg: #F6F4FA;
  --surface: #FFFFFF;
  --surface-2: #EFEBF6;
  --border: #E1DAEC;
  --fg: #1D1530;
  --fg-2: #4A4061;
  --fg-3: #6A6082;
  --accent: #EA580C;
  --accent-hover: #C2410C;
  --accent-ink: #C2410C;
  --accent-soft: rgba(234, 88, 12, .11);
  --accent-soft-2: rgba(234, 88, 12, .2);
  --on-accent: #FFFFFF;
  --brand-a: #F97316;
  --brand-b: #FDBA74;
  --ok: #047857;
  --ok-soft: rgba(4, 120, 87, .1);
  --warn: #A16207;
  --warn-soft: rgba(202, 138, 4, .13);
  --danger: #DC2626;
  --danger-soft: rgba(220, 38, 38, .1);
  --muted-soft: rgba(87, 77, 110, .1);
  --shadow: 0 1px 2px rgba(29, 21, 48, .05), 0 8px 24px rgba(29, 21, 48, .06);
  --header-bg: rgba(246, 244, 250, .86);

  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  --radius: 16px;
  --radius-sm: 10px;
  --max: 1160px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F0B1A; --surface: #1B1530; --surface-2: #231B3E; --border: #2C2347;
    --fg: #F2EEFF; --fg-2: #B8AFD4; --fg-3: #9087B2;
    --accent: #8B5CF6; --accent-hover: #9D74FF; --accent-ink: #C4B5FD;
    --accent-soft: rgba(139, 92, 246, .16); --accent-soft-2: rgba(139, 92, 246, .28); --on-accent: #FFFFFF;
    --brand-a: #6D28D9; --brand-b: #C084FC;
    --ok: #34D399; --ok-soft: rgba(52, 211, 153, .13);
    --warn: #FBBF24; --warn-soft: rgba(251, 191, 36, .13);
    --danger: #F87171; --danger-soft: rgba(248, 113, 113, .13);
    --muted-soft: rgba(169, 159, 199, .12);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .25);
    --header-bg: rgba(15, 11, 26, .82);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F0B1A; --surface: #1B1530; --surface-2: #231B3E; --border: #2C2347;
  --fg: #F2EEFF; --fg-2: #B8AFD4; --fg-3: #9087B2;
  --accent: #8B5CF6; --accent-hover: #9D74FF; --accent-ink: #C4B5FD;
  --accent-soft: rgba(139, 92, 246, .16); --accent-soft-2: rgba(139, 92, 246, .28); --on-accent: #FFFFFF;
  --brand-a: #6D28D9; --brand-b: #C084FC;
  --ok: #34D399; --ok-soft: rgba(52, 211, 153, .13);
  --warn: #FBBF24; --warn-soft: rgba(251, 191, 36, .13);
  --danger: #F87171; --danger-soft: rgba(248, 113, 113, .13);
  --muted-soft: rgba(169, 159, 199, .12);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .25);
  --header-bg: rgba(15, 11, 26, .82);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; font-size: 106.25%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
a { color: var(--accent-ink); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--accent-hover); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; text-wrap: pretty; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--accent); color: var(--on-accent); padding: 10px 16px; border-radius: 10px; font-weight: 700; text-decoration: none; }
.skip-link:focus { top: 12px; color: var(--on-accent); }
main:focus { outline: none; }
code, .mono { font-family: var(--font-mono); font-size: .88em; }
code { background: var(--surface-2); border: 1px solid var(--border); padding: .08em .4em; border-radius: 6px; overflow-wrap: anywhere; }

.wrap {
  max-width: var(--max);
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 720px) {
  .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
}

/* ---------- ícones ---------- */
.ico { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- cabeçalho ---------- */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--header-bg);
  backdrop-filter: saturate(1.4) blur(14px);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--border);
}
.header-row { display: flex; align-items: center; gap: 16px; height: 66px; }
.logo { display: flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; }
.logo:hover { color: var(--fg); }
.logo-mark {
  width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--brand-a), var(--brand-b)); color: #fff;
}
.logo-mark .ico { width: 22px; height: 22px; stroke-width: 2.9; }
.logo-text { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; letter-spacing: -.02em; }
.nav { display: flex; gap: 2px; margin-left: auto; }
.nav a {
  color: var(--fg-2); text-decoration: none; font-weight: 600; font-size: .96rem;
  padding: 8px 12px; border-radius: 999px;
}
.nav a:hover { color: var(--fg); background: var(--surface-2); }
.nav a[aria-current="page"] { color: var(--accent-ink); background: var(--accent-soft); }
.icon-btn {
  width: 40px; height: 40px; display: grid; place-items: center; flex: none;
  border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--fg-2); cursor: pointer;
}
.icon-btn:hover { color: var(--fg); border-color: var(--accent-soft-2); }
.menu-btn { display: none; }
@media (max-width: 940px) {
  .menu-btn { display: grid; margin-left: auto; }
  .nav {
    display: none; position: absolute; left: 0; right: 0; top: 66px;
    flex-direction: column; gap: 2px; background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  }
  .nav.open { display: flex; }
  .nav a { padding: 12px 14px; border-radius: 12px; font-size: 1rem; }
}

/* ---------- botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 700 .95rem/1 var(--font-body); padding: 13px 20px; border-radius: 12px;
  border: 1px solid transparent; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s, transform .15s;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); color: var(--on-accent); }
.btn.soft { background: var(--accent-soft); color: var(--accent-ink); }
.btn.soft:hover { background: var(--accent-soft-2); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--border); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn[disabled], .btn.is-disabled { background: var(--surface-2); color: var(--fg-3); border-color: var(--border); cursor: not-allowed; transform: none; }
.btn.small { padding: 9px 14px; font-size: .86rem; border-radius: 10px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- elementos comuns ---------- */
main { padding-block: 0 72px; }
.page { animation: page-in .35s ease both; }
@keyframes page-in { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.eyebrow {
  font-family: var(--font-mono); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--accent-ink); font-weight: 500;
}
.lead { color: var(--fg-2); font-size: 1.12rem; line-height: 1.7; max-width: 60ch; }
.muted { color: var(--fg-3); font-size: .92rem; }
.section { padding-block: 56px 0; }
.section-head { display: grid; gap: 8px; margin-bottom: 24px; }
.section-head h2 { font-size: clamp(1.6rem, 3vw, 2.1rem); }
.section-head p { color: var(--fg-2); max-width: 64ch; font-size: 1.03rem; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 22px; min-width: 0;
}
.grid { display: grid; gap: 16px; }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }

.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px;
  font-size: .82rem; font-weight: 700; white-space: nowrap;
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.accent { color: var(--accent-ink); background: var(--accent-soft); }
.pill.muted-pill { color: var(--fg-2); background: var(--muted-soft); }

.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px;
  font-size: .86rem; font-weight: 600; color: var(--fg-2); background: var(--surface-2); border: 1px solid var(--border);
}
.chip .ico { width: 15px; height: 15px; }
.chip.off { opacity: .55; text-decoration: line-through; }

.app-tile {
  width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; flex: none;
  background: color-mix(in srgb, var(--tint) 16%, transparent); color: var(--tint);
}
.app-tile .ico { width: 26px; height: 26px; }
.app-tile.big { width: 76px; height: 76px; border-radius: 22px; }
.app-tile.big .ico { width: 38px; height: 38px; }

/* ---------- HOME: hero ---------- */
.hero { padding-block: 56px 8px; display: grid; gap: 40px; align-items: center; grid-template-columns: 1fr; }
@media (min-width: 980px) { .hero { padding-block: 72px 8px; } }
.hero h1 { font-size: clamp(2.3rem, 5.4vw, 3.9rem); font-weight: 800; letter-spacing: -.03em; max-width: 16ch; }
.hero-copy { max-width: 760px; }
.shot { margin: 0; display: grid; gap: 10px; }
.shot img { display: block; width: 100%; height: auto; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); background: #0F0B1A; }
.shot figcaption { color: var(--fg-3); font-size: .92rem; }
.about-grid { display: grid; gap: 36px; align-items: center; grid-template-columns: 1fr; }
@media (min-width: 900px) { .about-grid { grid-template-columns: 1.3fr .7fr; } }
.about-art { margin: 0; border-radius: 28px; overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); }
.about-art svg { display: block; width: 100%; height: auto; }
.about-text { display: grid; gap: 16px; max-width: 62ch; font-size: 1.08rem; }
.about-text p { color: var(--fg-2); }
.origin { border-left: 3px solid var(--tint, var(--accent)); }
.hero h1 em { font-style: normal; color: var(--accent-ink); }
.hero-copy { display: grid; gap: 20px; min-width: 0; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--fg-3); font-size: .9rem; }
.hero-meta span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- mockup do launcher (sempre no visual real do app, que é escuro) ---------- */
.mock {
  --m-bg: #0F0B1A; --m-side: #140F24; --m-surface: #1B1530; --m-border: #2C2347;
  --m-fg: #F2EEFF; --m-fg2: #A99FC7; --m-fg3: #6E6491; --m-accent: #8B5CF6;
  background: var(--m-bg); color: var(--m-fg); border-radius: 18px; overflow: hidden;
  border: 1px solid #2C2347; box-shadow: 0 30px 60px -20px rgba(45, 20, 110, .45), 0 0 0 1px rgba(255,255,255,.02);
  font-size: 12px; line-height: 1.4; max-width: 100%; min-width: 0;
  display: grid; grid-template-rows: auto 1fr;
}
.mock-bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: #f5f3fa; color: #3a3150; font-size: 11.5px; }
.mock-bar .mini-logo { width: 14px; height: 14px; border-radius: 4px; background: linear-gradient(135deg, #6D28D9, #C084FC); }
.mock-bar .win { margin-left: auto; letter-spacing: 10px; color: #6b6380; }
.mock-body { display: grid; grid-template-columns: 132px 1fr; min-height: 300px; }
.mock-side { background: var(--m-side); border-right: 1px solid var(--m-border); padding: 14px 10px; display: grid; align-content: start; gap: 4px; }
.mock-brand { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
.mock-brand .lm { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #6D28D9, #C084FC); display: grid; place-items: center; }
.mock-brand .lm .ico { width: 16px; height: 16px; color: #fff; stroke-width: 2.9; }
.mock-brand b { display: block; font-size: 12.5px; }
.mock-brand small { color: var(--m-fg3); font-size: 10px; }
.mock-nav { padding: 6px 8px; border-radius: 7px; color: var(--m-fg2); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.mock-nav.on { background: rgba(139, 92, 246, .16); color: var(--m-fg); }
.mock-nav .n { background: rgba(251, 191, 36, .14); color: #FBBF24; border-radius: 99px; padding: 0 6px; font-size: 9.5px; }
.mock-main { padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.mock-hero { border-radius: 10px; padding: 12px; background: linear-gradient(135deg, #4C1D95, #2E1A5E 55%, #1B1530); border: 1px solid var(--m-border); }
.mock-hero b { font-size: 13px; }
.mock-hero p { color: var(--m-fg2); font-size: 10.5px; }
.mock-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mock-card { background: var(--m-surface); border: 1px solid var(--m-border); border-radius: 9px; padding: 9px; display: grid; gap: 7px; min-width: 0; }
.mock-card .top { display: flex; justify-content: space-between; align-items: start; gap: 4px; }
.mock-card .t { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: color-mix(in srgb, var(--tint) 18%, transparent); color: var(--tint); }
.mock-card .t .ico { width: 14px; height: 14px; }
.mock-card .badge { font-size: 8.5px; font-weight: 700; padding: 1px 6px; border-radius: 99px; white-space: nowrap; }
.mock-card b { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mock-card .v { color: var(--m-fg3); font-size: 9px; height: 12px; display: flex; align-items: center; }
.mock-card .bar { height: 4px; border-radius: 3px; background: #2A2149; overflow: hidden; width: 100%; }
.mock-card .bar i { display: block; height: 100%; width: 0; background: var(--m-accent); transition: width .1s linear; }
.mock-card .act { text-align: center; font-weight: 700; font-size: 9.5px; padding: 5px 0; border-radius: 6px; }
.act.open { background: #8B5CF6; color: #fff; }
.act.upd { background: rgba(251, 191, 36, .14); color: #FBBF24; }
.act.inst { background: rgba(139, 92, 246, .16); color: #C4B5FD; }
.act.wait { background: #2A2149; color: #6E6491; }
@media (max-width: 520px) {
  .mock-body { grid-template-columns: 1fr; }
  .mock-side { display: none; }
}

/* ---------- cartões de categoria / app ---------- */
.cat-card { display: grid; gap: 12px; text-decoration: none; color: var(--fg); transition: border-color .15s, transform .15s, background .15s; }
.cat-card:hover { color: var(--fg); border-color: var(--accent-soft-2); transform: translateY(-2px); }
.cat-card h3 { font-size: 1.25rem; }
.cat-card p { color: var(--fg-2); font-size: 1rem; }
.cat-card .go { display: inline-flex; align-items: center; gap: 6px; color: var(--accent-ink); font-weight: 700; font-size: .9rem; margin-top: auto; }

.app-card { display: grid; gap: 14px; grid-template-rows: auto auto 1fr auto; text-decoration: none; color: var(--fg); transition: border-color .15s, transform .15s; }
.app-card:hover { color: var(--fg); border-color: color-mix(in srgb, var(--tint) 45%, var(--border)); transform: translateY(-2px); }
.app-card .head { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
.app-card h3 { font-size: 1.3rem; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.app-card h3 small { font-family: var(--font-mono); font-size: .72rem; font-weight: 500; color: var(--fg-3); letter-spacing: .04em; text-transform: uppercase; }
.app-card p { color: var(--fg-2); font-size: 1rem; }
.app-card .foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* ---------- tabela de plataformas ---------- */
.table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
table.matrix { width: 100%; border-collapse: collapse; min-width: 560px; }
.matrix th, .matrix td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: .98rem; }
.matrix tr:last-child td { border-bottom: 0; }
.matrix th { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .07em; text-transform: uppercase; color: var(--fg-3); font-weight: 500; }
.matrix td:first-child a { color: var(--fg); font-weight: 700; text-decoration: none; display: inline-flex; gap: 10px; align-items: center; }
.matrix td:first-child a:hover { color: var(--accent-ink); }
.mark { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .92rem; }
.mark.yes { color: var(--ok); }
.mark.soon { color: var(--warn); }
.mark.no { color: var(--fg-3); }
.dot-tile { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--tint) 16%, transparent); color: var(--tint); }
.dot-tile .ico { width: 17px; height: 17px; }

/* ---------- caminhos de download (home) ---------- */
.path-card { display: grid; gap: 12px; }
.path-card h3 { font-size: 1.2rem; }
.path-card ol { margin: 0; padding-left: 1.2em; color: var(--fg-2); display: grid; gap: 6px; }
.path-card.featured { border-color: var(--accent-soft-2); background: linear-gradient(160deg, var(--accent-soft), var(--surface) 55%); }

/* ---------- página de app ---------- */
.crumbs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .93rem; color: var(--fg-3); padding-top: 28px; }
.crumbs a { color: var(--fg-2); text-decoration: none; }
.crumbs a:hover { color: var(--accent-ink); }
.app-hero { padding-block: 22px 8px; display: grid; gap: 22px; }
.app-hero-top { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.app-title h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); font-weight: 800; letter-spacing: -.03em; }
.app-title .sub {
  display: inline-block; font-family: var(--font-mono); font-size: .8rem; font-weight: 500; letter-spacing: .14em;

const OS = (() => {
  const ua = navigator.userAgent || "";
  if (/Android|iPhone|iPad|iPod/i.test(ua)) return "mobile";
  if (/Windows/i.test(ua)) return "windows";
  if (/Mac OS X|Macintosh/i.test(ua)) return "mac";
  if (/Linux|X11|CrOS/i.test(ua)) return "linux";

})();

  </div>`;
}

function osNote(app) {
  const plats = Object.entries(app.platforms).filter(([, p]) => p.status !== "none").map(([k]) => k);
  let text;
  if (app.isGame) {
    text = OS === "mobile" ? "Você está no celular: o Blockable funciona direto daqui." : "Você pode jogar direto deste navegador.";
  } else if (OS === "mobile") {
    text = "Você está no celular, mas estes apps são para computador. Abra esta página no PC para baixar.";
  } else if (OS === "windows" || OS === "linux") {
    text = plats.includes(OS)
      ? `Você está no ${PLATFORM_LABEL[OS]}. O download certo está destacado.`
      : `Você está no ${PLATFORM_LABEL[OS]}, mas este app ainda não tem versão para ele.`;
  } else if (OS === "mac") {
    text = "Você está no macOS. Por enquanto, os apps da NokyLabs são para Windows e Linux.";
  } else return "";
  return `<div class="os-note">${ico("info")}<span>${text}</span></div>`;
}

function downloadCard(app, key, p) {
  const label = PLATFORM_LABEL[key];
  const mine = p.status !== "none" && (key === OS || (key === "web" && app.isGame));
  let button;
  if (p.status === "available") {
    const href = key === "web" ? p.url : (p.url || downloadUrl(app, p.file));
    button = `<a class="btn primary" href="${href}" target="_blank" rel="noopener">${ico(key === "web" ? "web" : "download")}${key === "web" ? "Jogar agora" : "Baixar para " + label}</a>`;
  } else if (p.status === "request") {
    button = `<a class="btn primary" href="${esc(app.requestAccess)}">${ico("shield")}Solicitar acesso</a>`;
  } else if (p.status === "soon") {
    button = `<button class="btn" disabled>${ico("clock")}Em breve</button>`;
  } else {
    button = `<button class="btn" disabled>Ainda não disponível</button>`;
  }
  const details = p.status === "none"
    ? `<p class="muted">Ainda não existe versão do ${esc(app.name)} para ${label}.</p>`
    : `<dl>
        <dt>Arquivo</dt><dd class="mono">${esc(p.file)}</dd>
        <dt>Requisitos</dt><dd>${esc(p.req)}</dd>
        ${p.size && p.size !== "—" ? `<dt>Tamanho</dt><dd>${esc(p.size)}</dd>` : ""}
      </dl>
      ${p.status === "soon" ? `<p class="muted">O botão é liberado assim que a versão for publicada.</p>` : ""}
      ${p.status === "request" ? `<p class="muted">Este app é de uso restrito. Peça acesso por e-mail: quando o pedido for aprovado, você recebe o arquivo.</p>` : ""}`;
  return `<div class="card dl-card ${mine ? "mine" : ""}">
    ${mine ? `<span class="mine-tag">Seu sistema</span>` : ""}
    <div class="plat">${ico(PLATFORM_ICON[key])}<h3>${label}</h3></div>
    ${details}
    ${button}
  </div>`;
}

function setupContact() {
  const $ = id => document.getElementById(id);
  if (contactPreset) { $("fApp").value = contactPreset; contactPreset = null; }

  const build = () => {
    const kind = document.querySelector('input[name="kind"]:checked').value;
    const appKey = $("fApp").value;
    const app = APPS[appKey];
    const appName = app ? app.name + (app.subtitle ? " " + app.subtitle : "") : "Geral / site";
    const isBug = kind === "Bug";
    document.querySelectorAll("[data-bug-only]").forEach(el => el.hidden = !isBug);

    const lines = [
      `Tipo: ${kind}`,
      `App: ${appName}`,
      `Versão: ${$("fVer").value.trim() || "não informada"}`,
      `Sistema: ${$("fOs").value.trim() || "não informado"}`,
      "",
      "O que aconteceu:",
      $("fWhat").value.trim() || "(descreva aqui)",
    ];
    if (isBug) {
      lines.push("", "Como reproduzir:", $("fSteps").value.trim() || "(passos aqui)");
      lines.push("", "Resultado esperado:", $("fExpected").value.trim() || "(o que deveria acontecer)");
    }
    const body = lines.join("\n");
    const subject = `[NokyLabs] ${kind} · ${appName}`;
    $("preview").textContent = `Assunto: ${subject}\n\n${body}`;
    $("mailReport").href = `mailto:${SITE.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

    const gh = $("ghReport");
    if (app && app.repoPublic) {
      gh.hidden = false;
      gh.href = `${repoUrl(app)}/issues/new?title=${encodeURIComponent(`${kind}: ${($("fWhat").value.trim().split("\n")[0] || appName).slice(0, 80)}`)}&body=${encodeURIComponent(body)}`;
    } else {
      gh.hidden = true;
    }
    $("copyReport").dataset.text = `Assunto: ${subject}\n\n${body}`;
  };

  $("reportForm").addEventListener("input", build);
  $("reportForm").addEventListener("change", build);
  $("reportForm").addEventListener("submit", e => e.preventDefault());
  $("copyReport").addEventListener("click", e => copyText(e.currentTarget.dataset.text, "Relatório copiado", $("preview")));
  $("copyMail").addEventListener("click", () => copyText(SITE.email, "E-mail copiado", $("mailAddr")));
  build();
}

const main = document.getElementById("app");
const nav = document.getElementById("nav");
const menuBtn = document.getElementById("menuBtn");
let mockTimer = null;

let currentTab = null;
function render() {
  const [key, tab] = (location.hash || "#home").slice(1).split("/");
  currentTab = tab || null;
  const route = ROUTES[key] || ROUTES.home;
  nav.innerHTML = NAV.map(([k, l]) => `<a href="#${k}" ${route.nav === k ? 'aria-current="page"' : ""}>${l}</a>`).join("");
  main.innerHTML = `<div class="page">${route.render()}</div>`;
  document.title = route.title === "NokyLabs" ? "NokyLabs" : `${route.title} · NokyLabs`;
  nav.classList.remove("open");
  menuBtn.setAttribute("aria-expanded", "false");
  window.scrollTo({ top: 0, behavior: "auto" });
  wirePage(key);
}
// O link "Pular para o conteúdo" não pode mexer no endereço (a rota fica em #): só leva o foco para o conteúdo
document.getElementById("skipLink").addEventListener("click", e => { e.preventDefault(); main.focus(); main.scrollIntoView(); });

function wirePage(key) {
  // Abas da página de um app: mostra só a aba escolhida
  window.onscroll = null;
  const tabBar = main.querySelector(".tabs");
  const showTab = id => {
    if (!main.querySelector(`[data-panel="${id}"]`)) return;
    main.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== id);
    main.querySelectorAll(".tabs button").forEach(b => {
      const on = b.dataset.jump === id;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", on);
    });
    currentTab = id;
    history.replaceState(null, "", "#" + key + (id === "visao" ? "" : "/" + id));
    // Se a pessoa já desceu a página, volta para o começo das abas
    if (tabBar) {
      const hero = tabBar.previousElementSibling;   // a aba "gruda" no topo logo depois do cabeçalho do app
      const stick = hero.getBoundingClientRect().bottom + window.scrollY + 28 - 66;
      if (window.scrollY > stick) window.scrollTo({ top: stick, behavior: "auto" });
    }
  };
  main.querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => showTab(b.dataset.jump)));

  // Guia de instalação por sistema
  main.querySelectorAll("[data-inst]").forEach(b => b.addEventListener("click", () => {
    main.querySelectorAll("[data-inst]").forEach(x => x.classList.toggle("on", x === b));
    main.querySelectorAll("[data-inst-panel]").forEach(p => p.hidden = p.dataset.instPanel !== b.dataset.inst);
  }));

  // Busca nas dúvidas
  const search = document.getElementById("faqSearch");
  if (search) search.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    let shown = 0;
    document.querySelectorAll("#faqList details").forEach(d => {
      const hit = !q || d.textContent.toLowerCase().includes(q);
      d.hidden = !hit; if (hit) shown++;
      if (q && hit) d.open = true;
    });
    document.getElementById("faqEmpty").hidden = shown > 0;
  });

  // "Falar sobre este app" abre o contato já com o app escolhido
  main.querySelectorAll("[data-contact]").forEach(b => b.addEventListener("click", () => {
    contactPreset = b.dataset.contact;
    location.hash = "contato";
  }));

  // Filtro das novidades
  const filters = document.getElementById("newsFilters");
  if (filters) filters.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    filters.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll("#newsList li").forEach(li => li.hidden = b.dataset.filter !== "all" && li.dataset.app !== b.dataset.filter);
  });

  if (key === "contato") setupContact();
  startMock();
}

/* Animação do card "YT-DLP GUI" no mockup: Instalar → progresso → Abrir */
function startMock() {
  clearInterval(mockTimer);
  const card = document.getElementById("mockInstall");
  if (!card || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const badge = card.querySelector("[data-badge]"), ver = card.querySelector("[data-ver]"), act = card.querySelector("[data-act]");
  if (!badge || !ver || !act) return;
  let t = 0;
  mockTimer = setInterval(() => {
    t = (t + 1) % 70;
    if (t === 12) { act.className = "act wait"; act.textContent = "Aguarde…"; ver.innerHTML = '<span class="bar"><i></i></span>'; }
    if (t > 12 && t <= 37) { const bar = ver.querySelector("i"); if (bar) bar.style.width = ((t - 12) * 4) + "%"; }
    if (t === 38) {
      act.className = "act open"; act.textContent = "Abrir"; ver.textContent = "v9 · em dia";
      badge.textContent = "Instalado"; badge.style.cssText = "background:rgba(52,211,153,.14);color:#34D399";
    }
    if (t === 0) {
      act.className = "act inst"; act.textContent = "Instalar"; ver.textContent = "v9 disponível";
      badge.textContent = "Disponível"; badge.style.cssText = "background:rgba(139,92,246,.16);color:#C4B5FD";
    }
  }, 100);
}

/* Copiar com plano B (seleciona o texto se a área de transferência recusar) */
function copyText(text, okMsg, fallbackEl) {
  const done = () => toast(okMsg);
  const fallback = () => {
    if (fallbackEl) {
      const range = document.createRange(); range.selectNodeContents(fallbackEl);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    }
    toast("Texto selecionado: use Ctrl+C para copiar");
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  } catch { fallback(); }
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

/* Tema: segue o sistema até a pessoa escolher; a escolha fica salva neste navegador */
const themeBtn = document.getElementById("themeBtn");
function currentTheme() {
  const set = document.documentElement.dataset.theme;
  if (set === "dark" || set === "light") return set;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function paintThemeBtn() {
  const dark = currentTheme() === "dark";
  themeBtn.innerHTML = ico(dark ? "sun" : "moon");
  themeBtn.setAttribute("aria-label", dark ? "Mudar para o tema claro" : "Mudar para o tema escuro");
}
try { const saved = localStorage.getItem("nokylabs-theme"); if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved; } catch {}
themeBtn.addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("nokylabs-theme", next); } catch {}
  paintThemeBtn();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", paintThemeBtn);
new MutationObserver(paintThemeBtn).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

menuBtn.addEventListener("click", () => {
  const open = nav.classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", String(open));
});

/* Rodapé */
document.getElementById("footer").innerHTML = `
  <div class="footer-col" style="max-width:320px">
    <a class="logo" href="#home"><span class="logo-mark">${ico("logo")}</span><span class="logo-text">NokyLabs</span></a>
    <p>Soluções pequenas para problemas reais, criadas com cuidado. <a href="#sobre">Saiba mais</a></p>
  </div>
  <div class="footer-col"><b>Projetos</b>
    <a href="#launcher">NokyLabs Launcher</a>${ORDER_UTIL.map(k => `<a href="#${APPS[k].route}">${APPS[k].name}</a>`).join("")}
    <a href="#avaliador">Avaliador Acadêmico</a><a href="#blockable">Blockable</a>
  </div>
  <div class="footer-col"><b>Site</b><a href="#sobre">Sobre</a><a href="#novidades">Novidades</a><a href="#contato">Contato e bugs</a>
    <a href="https://github.com/${SITE.github}" target="_blank" rel="noopener">GitHub</a></div>
  <div class="footer-col"><b>E-mail</b><a class="footer-mail" href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a></div>`;

window.addEventListener("hashchange", render);
paintThemeBtn();
render();

/* =====================================================================
   CATÁLOGO: versões, links, tamanhos e novidades vêm do catalogo.json,
   o mesmo arquivo que o NokyLabs Launcher lê (mantido em dia pelo robô
   do catálogo). O que está escrito em APPS fica como reserva, caso o
   arquivo não carregue. Assim, lançar uma versão não exige editar o site.
   ===================================================================== */
const CATALOG_ID = { ytdlp: "ytdlp-gui" };

function applyCatalog(cat) {
  let mudou = false;
  for (const app of Object.values(APPS)) {
    const c = app.id === "launcher" ? cat.launcher
      : (cat.apps || []).find(a => a.id === (CATALOG_ID[app.id] || app.id));
    if (!c) continue;
    if (c.requestAccess) {
      // Uso restrito: nada de download, só o pedido de acesso.
      app.requestAccess = c.requestAccess;
      for (const p of Object.values(app.platforms || {})) if (p.status !== "none") p.status = "request";
      mudou = true;
      continue;
    }
    if (!c.downloads) continue;
    let publicado = false;
    for (const [key, d] of Object.entries(c.downloads)) {
      const p = app.platforms?.[key];
      if (!p || !d || !d.published || !d.url) continue;
      publicado = true;
      p.status = "available";
      p.url = d.url;
      p.file = d.url.split("/").pop();
      if (d.size) p.size = fmtSize(d.size) + (p.sizeNote ? " " + p.sizeNote : "");
      mudou = true;
    }
    if (publicado && c.version) app.version = c.version;
    if (publicado && c.notes) app.notes = c.notes;
  }
  return mudou;
}

fetch("catalogo.json", { cache: "no-cache" })
  .then(r => (r.ok ? r.json() : null))
  .then(cat => {
    if (!cat || !applyCatalog(cat)) return;
    const y = window.scrollY;
    render();
    window.scrollTo({ top: y, behavior: "auto" });
  })
  .catch(() => { /* sem catálogo: o site usa os valores escritos em APPS */ });
</script>
