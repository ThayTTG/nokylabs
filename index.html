<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#110e1a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf6f1" media="(prefers-color-scheme: light)">
<meta property="og:title" content="NokyLabs">
<meta property="og:description" content="Soluções pequenas para problemas reais: utilitários, um app de avaliação e um jogo.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thayttg.github.io/nokylabs/">
<title>NokyLabs</title>
<meta name="description" content="NokyLabs: soluções pequenas para problemas reais. Utilitários, um app de avaliação e um jogo.">
<link rel="preload" href="fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-display-700.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* Aplica o tema salvo antes de desenhar a página, para não piscar */
try {
  var temaSalvo = localStorage.getItem("nokylabs-tema") || { dark: "escuro", light: "claro" }[localStorage.getItem("nokylabs-theme")];
  if (temaSalvo === "claro" || temaSalvo === "escuro") document.documentElement.dataset.tema = temaSalvo;
} catch (e) {}
</script>
<style>
/* Visual: Kit NokyLabs (o design system extraído do ValReport).
   As variáveis têm os mesmos nomes do ValReport (--fundo, --destaque, --raio…),
   para que um trecho copiado de lá funcione igual aqui.
   Claro = laranja sobre creme · Escuro = roxo. O tema segue o sistema até a pessoa escolher.
   Layout: cabeçalho grudado + páginas trocadas por rota (#launcher, #cubebin…), largura máx. 1180px. */
@font-face { font-family: "Inter"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/inter-400.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/inter-500.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 600; font-style: normal; font-display: swap; src: url("fonts/inter-600.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/inter-700.woff2") format("woff2"); }
@font-face { font-family: "Inter Display"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/inter-display-700.woff2") format("woff2"); }

:root {
  /* tema claro (laranja) */
  --fundo: #faf6f1;
  --superficie: #ffffff;
  --superficie-2: #f5eee6;
  --superficie-3: #ece2d6;
  --borda: #e6dacd;
  --texto: #241b14;
  --texto-2: #4a3d33;
  --suave: #7d6e62;
  --destaque: #ec7518;
  --destaque-forte: #d2620a;
  --destaque-suave: #fde5d0;
  --destaque-texto: #b0520a;
  --sobre-destaque: #ffffff;
  /* Fundo dos botões cheios (texto branco). No claro, o laranja do Kit dá só 2,9:1 com o branco;
     este tom (o mesmo do --destaque-texto) dá 5,2:1 e o hover 6,4:1. No escuro, é o roxo de sempre. */
  --destaque-botao: #b0520a;
  --destaque-botao-forte: #9a4708;
  --vitoria: #1b9a57;
  --vitoria-suave: #dcf3e6;
  --derrota: #d64545;
  --derrota-suave: #fbe0e0;
  --alerta: #b77b09;
  --alerta-suave: #fbefd4;
  --ouro: #f2b33d;
  --marca-roxo: #a068ff;
  --marca-laranja: #ec7518;
  --sombra: 0 10px 28px rgba(70, 40, 10, .10);

  /* Só do site. No tema claro, o texto dos selos e a cor de cada app escurecem um pouco para dar leitura
     (o caminho que o próprio Kit indica); no escuro, valem as cores puras. */
  --vitoria-tinta: #126c3d;
  --alerta-tinta: #7d5406;
  --tint-mix: 46%;

  --fonte: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fonte-titulo: "Inter Display", "Inter", system-ui, sans-serif;
  --fonte-mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;

  --raio: 16px;
  --raio-p: 10px;
  --largura: 1180px;
  --curva: cubic-bezier(.2, .7, .2, 1);
  --topo: 66px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --fundo: #110e1a; --superficie: #1c1729; --superficie-2: #251f36; --superficie-3: #2f2843; --borda: #342b4b;
    --texto: #f0ecf8; --texto-2: #c9c1db; --suave: #968dac;
    --destaque: #a068ff; --destaque-forte: #8a4dff; --destaque-suave: #3a2a60; --destaque-texto: #ccb2ff; --sobre-destaque: #ffffff;
    --destaque-botao: #a068ff; --destaque-botao-forte: #8a4dff;
    --vitoria: #54d688; --vitoria-suave: #1a3628; --derrota: #f67070; --derrota-suave: #42202a;
    --alerta: #f6b84c; --alerta-suave: #3d2f17;
    --sombra: 0 10px 30px rgba(0, 0, 0, .35);
    --vitoria-tinta: #54d688; --alerta-tinta: #f6b84c; --tint-mix: 68%;
    color-scheme: dark;
  }
}
:root[data-tema="escuro"] {
  --fundo: #110e1a; --superficie: #1c1729; --superficie-2: #251f36; --superficie-3: #2f2843; --borda: #342b4b;
  --texto: #f0ecf8; --texto-2: #c9c1db; --suave: #968dac;
  --destaque: #a068ff; --destaque-forte: #8a4dff; --destaque-suave: #3a2a60; --destaque-texto: #ccb2ff; --sobre-destaque: #ffffff;
    --destaque-botao: #a068ff; --destaque-botao-forte: #8a4dff;
  --vitoria: #54d688; --vitoria-suave: #1a3628; --derrota: #f67070; --derrota-suave: #42202a;
  --alerta: #f6b84c; --alerta-suave: #3d2f17;
  --sombra: 0 10px 30px rgba(0, 0, 0, .35);
  --vitoria-tinta: #54d688; --alerta-tinta: #f6b84c; --tint-mix: 68%;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; font-size: 106.25%; }
body {
  background: var(--fundo);
  color: var(--texto);
  font-family: var(--fonte);
  font-size: 1rem;
  line-height: 1.65;
  font-feature-settings: "cv11", "ss01";
  -webkit-font-smoothing: antialiased;
}
a { color: var(--destaque-texto); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--destaque-texto); }
:focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { font-family: var(--fonte-titulo); font-weight: 700; line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -.02em; }
h3, h4 { font-family: var(--fonte); letter-spacing: -.005em; line-height: 1.2; }
p { margin: 0; text-wrap: pretty; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--destaque); color: var(--sobre-destaque); padding: 10px 18px; border-radius: 999px; font-weight: 700; text-decoration: none; }
.skip-link:focus { top: 12px; color: var(--sobre-destaque); }
main:focus { outline: none; }
code, .mono { font-family: var(--fonte-mono); font-size: .88em; }
code { background: var(--superficie-2); border: 1px solid var(--borda); padding: .08em .4em; border-radius: 6px; overflow-wrap: anywhere; }
.num { font-variant-numeric: tabular-nums; }

.wrap {
  max-width: var(--largura);
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 720px) {
  .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
}

/* ---------- ícones (24×24, traço de 2px, pontas arredondadas) ---------- */
.ico { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- cabeçalho: grudado, translúcido (88% do fundo) e com desfoque ---------- */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--fundo) 88%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--borda);
}
.header-row { display: flex; align-items: center; gap: 12px; height: var(--topo); }
.logo { display: flex; align-items: center; gap: 10px; color: var(--texto); text-decoration: none; }
.logo:hover { color: var(--texto); }
/* O símbolo: o "n" branco num quadrado na cor do tema (roxo no escuro, laranja no claro) */
.logo-mark { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--destaque); color: #fff; }
.logo-mark .ico { width: 22px; height: 22px; stroke-width: 2.9; }
.logo-text { font-family: var(--fonte-titulo); font-weight: 700; font-size: 1.2rem; letter-spacing: -.02em; }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a {
  color: var(--texto-2); text-decoration: none; font-weight: 600; font-size: .92rem;
  padding: 8px 12px; border-radius: 999px; transition: transform .2s ease, background-color .2s, color .2s;
}
.nav a:hover { color: var(--texto); background: var(--superficie-2); }
.nav a:active { transform: scale(.96); }
.nav a[aria-current="page"] { color: var(--destaque-texto); background: var(--destaque-suave); }
.icon-btn {
  width: 40px; height: 40px; display: grid; place-items: center; flex: none;
  border-radius: 12px; border: 1px solid var(--borda); background: var(--superficie); color: var(--texto-2); cursor: pointer;
  transition: transform .2s ease, background-color .2s, color .2s;
}
.icon-btn:hover { color: var(--texto); background: var(--superficie-2); }
.icon-btn:active { transform: scale(.92); }
.menu-btn { display: none; }
@media (max-width: 940px) {
  .menu-btn { display: grid; margin-left: auto; }
  .nav {
    display: none; position: absolute; left: 0; right: 0; top: var(--topo);
    flex-direction: column; gap: 2px; background: var(--fundo); border-bottom: 1px solid var(--borda);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  }
  .nav.open { display: flex; animation: entrar .3s var(--curva) backwards; }
  .nav a { padding: 12px 16px; font-size: 1rem; }
}

/* ---------- botões: pílulas ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
  font: 700 .88rem/1.2 var(--fonte); padding: 10px 20px; border-radius: 999px;
  border: 1px solid var(--borda); background: var(--superficie-2); color: var(--suave);
  cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: transform .2s, box-shadow .2s, background-color .2s, border-color .2s, color .2s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--destaque-botao); color: var(--sobre-destaque); border-color: transparent; box-shadow: 0 6px 18px color-mix(in srgb, var(--destaque) 35%, transparent); }
.btn.primary:hover { background: var(--destaque-botao-forte); color: var(--sobre-destaque); }
.btn.soft { background: var(--destaque-suave); color: var(--destaque-texto); border-color: transparent; }
.btn.soft:hover { background: color-mix(in srgb, var(--destaque) 24%, var(--superficie)); color: var(--destaque-texto); }
.btn.ghost { background: var(--superficie); color: var(--texto); border-color: var(--borda); }
.btn.ghost:hover { border-color: var(--destaque); color: var(--destaque-texto); }
.btn[disabled], .btn.is-disabled { background: var(--superficie-2); color: var(--suave); border-color: var(--borda); box-shadow: none; cursor: not-allowed; transform: none; }
.btn.small { min-height: 36px; padding: 6px 14px; font-size: .8rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- elementos comuns ---------- */
main { padding-block: 0 72px; }
.eyebrow { font-size: .76rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
.lead { color: var(--texto-2); font-size: 1.1rem; line-height: 1.65; max-width: 60ch; }
.muted { color: var(--suave); font-size: .92rem; }
.section { padding-block: 56px 0; }
.section-head { display: grid; gap: 8px; margin-bottom: 22px; }
.section-head h2 { font-size: clamp(1.4rem, 3vw, 1.75rem); }
.section-head p { color: var(--texto-2); max-width: 64ch; font-size: 1.03rem; }
.card {
  background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio);
  padding: 20px; min-width: 0;
}
.grid { display: grid; gap: 14px; }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }

/* Selos */
.pill {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px;
  font-size: .74rem; font-weight: 700; white-space: nowrap; background: var(--superficie-3); color: var(--texto-2);
}
.pill.ok { color: var(--vitoria-tinta); background: var(--vitoria-suave); }
.pill.warn { color: var(--alerta-tinta); background: var(--alerta-suave); }
.pill.accent { color: var(--destaque-texto); background: var(--destaque-suave); }
.pill.muted-pill { color: var(--texto-2); background: var(--superficie-3); }

/* Chips */
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
  font-size: .8rem; font-weight: 600; color: var(--texto-2); background: var(--superficie-2); border: 1px solid var(--borda);
  text-decoration: none; transition: transform .2s ease, border-color .2s, color .2s;
}
a.chip:hover { border-color: var(--destaque); color: var(--destaque-texto); }
a.chip:active { transform: scale(.96); }
.chip .ico { width: 15px; height: 15px; }
.chip.off { opacity: .55; text-decoration: line-through; }

/* A cor de cada app (--tint) entra no quadradinho do ícone, na borda e no brilho do cartão */
.app-tile, .dot-tile, .feature .fi { color: color-mix(in srgb, var(--tint, var(--destaque)) var(--tint-mix), var(--texto)); background: color-mix(in srgb, var(--tint, var(--destaque)) 16%, transparent); }
.app-tile { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; flex: none; }
.app-tile .ico { width: 26px; height: 26px; }
.app-tile.big { width: 76px; height: 76px; border-radius: 20px; }
.app-tile.big .ico { width: 38px; height: 38px; }

/* ---------- HOME: hero ---------- */
.hero {
  margin-top: 28px; padding: 36px 22px; border-radius: calc(var(--raio) + 8px);
  border: 1px solid color-mix(in srgb, var(--destaque) 35%, var(--borda));
  background: radial-gradient(600px 300px at 100% 0%, color-mix(in srgb, var(--destaque) 24%, transparent), transparent 70%), var(--superficie);
}
@media (min-width: 720px) { .hero { padding: 52px 44px; } }
.hero h1 { font-size: clamp(2rem, 6vw, 3.1rem); line-height: 1.05; max-width: 16ch; }
.hero h1 em { font-style: normal; color: var(--destaque-texto); }
.hero-copy { display: grid; gap: 18px; justify-items: start; min-width: 0; max-width: 760px; }
.hero-selo { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--destaque-suave); color: var(--destaque-texto); font-size: .76rem; font-weight: 700; }
.hero-selo .ico { width: 14px; height: 14px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--suave); font-size: .88rem; }
.hero-meta span { display: inline-flex; align-items: center; gap: 6px; }
.shot { margin: 0; display: grid; gap: 10px; }
.shot img { display: block; width: 100%; height: auto; border-radius: var(--raio); border: 1px solid var(--borda); box-shadow: var(--sombra); background: #110e1a; }
.shot figcaption { color: var(--suave); font-size: .92rem; }
.about-grid { display: grid; gap: 36px; align-items: center; grid-template-columns: 1fr; }
@media (min-width: 900px) { .about-grid { grid-template-columns: 1.3fr .7fr; } }
.about-art { margin: 0; border-radius: calc(var(--raio) + 8px); overflow: hidden; border: 1px solid var(--borda); background: var(--superficie-2); }
.about-art svg { display: block; width: 100%; height: auto; }
.about-text { display: grid; gap: 16px; max-width: 62ch; font-size: 1.08rem; }
.about-text p { color: var(--texto-2); }
.origin { border-left: 3px solid var(--tint, var(--destaque)); }

/* ---------- cartões de categoria / app: sobem 2px e ganham um brilho que segue o mouse ---------- */
.cat-card, .app-card {
  position: relative; overflow: hidden; isolation: isolate; display: grid; text-decoration: none; color: var(--texto);
  transition: transform .2s ease, border-color .2s, box-shadow .2s;
}
.cat-card::before, .app-card::before {
  content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity .25s; pointer-events: none;
  background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), color-mix(in srgb, var(--tint, var(--destaque)) 15%, transparent), transparent 60%);
}
.cat-card:hover, .app-card:hover {
  color: var(--texto); border-color: color-mix(in srgb, var(--tint, var(--destaque)) 55%, var(--borda));
  transform: translateY(-2px); box-shadow: var(--sombra);
}
.cat-card:hover::before, .app-card:hover::before { opacity: 1; }
.cat-card { gap: 12px; grid-template-rows: auto auto 1fr auto; }
.cat-card h3 { font-size: 1.2rem; }
.cat-card p { color: var(--texto-2); font-size: 1rem; }
.cat-card .go { display: inline-flex; align-items: center; gap: 6px; color: var(--destaque-texto); font-weight: 700; font-size: .88rem; margin-top: auto; }
.cat-card .go .ico { transition: transform .2s ease; }
.cat-card:hover .go .ico { transform: translateX(3px); }

.app-card { gap: 14px; grid-template-rows: auto auto 1fr auto; }
.app-card .head { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
.app-card h3 { font-size: 1.25rem; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.app-card h3 small { font-size: .7rem; font-weight: 700; color: var(--suave); letter-spacing: .06em; text-transform: uppercase; }
.app-card p { color: var(--texto-2); font-size: 1rem; }
.app-card .foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* ---------- tabela de plataformas ---------- */
/* position: relative segura aqui dentro os textos para leitor de tela; sem isso a página ganhava rolagem lateral no celular */
.table-scroll { position: relative; overflow-x: auto; border: 1px solid var(--borda); border-radius: var(--raio); background: var(--superficie); }
table.matrix { width: 100%; border-collapse: collapse; min-width: 560px; }
.matrix th, .matrix td { padding: 13px 16px; text-align: left; border-bottom: 1px solid var(--borda); font-size: .98rem; }
.matrix tr:last-child td { border-bottom: 0; }
.matrix tbody tr { transition: background-color .2s; }
.matrix tbody tr:hover { background: var(--superficie-2); }
.matrix th { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); font-weight: 700; }
.matrix td:first-child a { color: var(--texto); font-weight: 700; text-decoration: none; display: inline-flex; gap: 10px; align-items: center; }
.matrix td:first-child a:hover { color: var(--destaque-texto); }
.mark { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .9rem; }
.mark.yes { color: var(--vitoria-tinta); }
.mark.soon { color: var(--alerta-tinta); }
.mark.no { color: var(--suave); }
.dot-tile { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
.dot-tile .ico { width: 17px; height: 17px; }

/* ---------- caminhos de download (home) ---------- */
.path-card { display: grid; gap: 12px; justify-items: start; }
.path-card h3 { font-size: 1.2rem; }
.path-card ol { margin: 0; padding-left: 1.2em; color: var(--texto-2); display: grid; gap: 6px; }
/* O cartão recomendado é o único com brilho em loop na tela */
.path-card.featured {
  position: relative; overflow: hidden; border-radius: calc(var(--raio) + 4px);
  border-color: color-mix(in srgb, var(--destaque) 50%, var(--borda));
  background: linear-gradient(135deg, color-mix(in srgb, var(--destaque) 24%, var(--superficie)), var(--superficie) 70%);
}
.path-card.featured::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; transform: translateX(-100%);
  background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .14) 48%, transparent 66%);
  animation: reluz 4.2s ease-in-out 1.2s infinite;
}

/* ---------- página de app ---------- */

const ico = (name, cls = "") => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${I[name] || name}"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const notesList = notes => String(notes).split("\n")
  .map(l => l.trim()).filter(l => l && !l.startsWith("#"))
  .map(l => `<li>${ico("sparkle")}<span>${esc(l.replace(/^[-*]\s+/, "").replace(/\*\*|`/g, ""))}</span></li>`).join("");

const OS = (() => {
  const ua = navigator.userAgent || "";
  if (/Android|iPhone|iPad|iPod/i.test(ua)) return "mobile";
  if (/Windows/i.test(ua)) return "windows";
  if (/Mac OS X|Macintosh/i.test(ua)) return "mac";
  if (/Linux|X11|CrOS/i.test(ua)) return "linux";
  return "unknown";
})();

const pill = ([text, kind]) => `<span class="pill ${kind === "muted" ? "muted-pill" : kind}">${esc(text)}</span>`;

function platformChips(app) {
  return Object.entries(app.platforms)
    .filter(([, p]) => p.status !== "none")
    .map(([k]) => `<span class="chip">${ico(PLATFORM_ICON[k])}${PLATFORM_LABEL[k]}</span>`)
    .join("");
}

function appTitle(app) {
  return app.subtitle ? `${esc(app.name)} <small>${esc(app.subtitle)}</small>` : esc(app.name);
}

function appCard(app) {
  return `
  <a class="card app-card" href="#${app.route}" style="--tint:${app.tint}">
    <div class="head">
      <span class="app-tile">${ico(app.icon)}</span>
      ${pill(app.status)}
    </div>
    <h3>${appTitle(app)}</h3>
    <p>${esc(app.tagline)}</p>
    <div class="foot">${platformChips(app)}</div>

}

function gameProgress(app) {
  return `<div class="card" style="margin-top:16px">
    <h3 style="font-size:1.15rem;margin-bottom:14px">Andamento</h3>
    <div class="progress-list">${app.progress.map(([t, v]) => `
      <div class="progress-item"><div class="row"><span>${t}</span><span data-conta="${v}">${v}%</span></div><div class="track"><i style="width:${v}%"></i></div></div>`).join("")}
    </div>
    <p class="muted" style="margin-top:12px">Estimativa da desenvolvedora, atualizada a cada versão.</p>
  </div>`;
}

function osNote(app) {
  const plats = Object.entries(app.platforms).filter(([, p]) => p.status !== "none").map(([k]) => k);
  let text;
  if (app.isGame) {
    text = OS === "mobile" ? "Você está no celular: o Blockable funciona direto daqui." : "Você pode jogar direto deste navegador.";
  } else if (app.isWeb) {
    text = OS === "mobile" ? `Você está no celular: o ${app.name} funciona direto daqui e pode ser instalado como app.` : `O ${app.name} abre direto deste navegador.`;
  } else if (OS === "mobile") {
    text = "Você está no celular, mas estes apps são para computador. Abra esta página no PC para baixar.";
  } else if (OS === "windows" || OS === "linux") {
    text = plats.includes(OS)
      ? `Você está no ${PLATFORM_LABEL[OS]}. O download certo está destacado.`
      : `Você está no ${PLATFORM_LABEL[OS]}, mas este app ainda não tem versão para ele.`;
  } else if (OS === "mac") {
    text = "Você está no macOS. Por enquanto, os apps da NokyLabs são para Windows e Linux.";
  } else return "";
  return `<div class="os-note">${ico("info")}<span>${text}</span></div>`;
}

function downloadCard(app, key, p) {
  const label = PLATFORM_LABEL[key];
  const mine = p.status !== "none" && (key === OS || (key === "web" && (app.isGame || app.isWeb)));
  let button;
  if (p.status === "available") {
    const href = key === "web" ? p.url : (p.url || downloadUrl(app, p.file));
    button = `<a class="btn primary" href="${href}" target="_blank" rel="noopener">${ico(key === "web" ? "web" : "download")}${key === "web" ? (app.isWeb ? "Abrir o site" : "Jogar agora") : "Baixar para " + label}</a>`;
  } else if (p.status === "request") {
    button = `<a class="btn primary" href="${esc(app.requestAccess)}">${ico("shield")}Solicitar acesso</a>`;
  } else if (p.status === "soon") {
    button = `<button class="btn" disabled>${ico("clock")}Em breve</button>`;
  } else {
    button = `<button class="btn" disabled>Ainda não disponível</button>`;
  }
  const details = p.status === "none"
    ? `<p class="muted">Ainda não existe versão do ${esc(app.name)} para ${label}.</p>`
    : `<dl>
        <dt>${app.isWeb ? "Endereço" : "Arquivo"}</dt><dd class="mono">${esc(p.file)}</dd>
        <dt>Requisitos</dt><dd>${esc(p.req)}</dd>
        ${p.size && p.size !== "—" ? `<dt>Tamanho</dt><dd>${esc(p.size)}</dd>` : ""}
      </dl>
      ${p.status === "soon" ? `<p class="muted">O botão é liberado assim que a versão for publicada.</p>` : ""}
      ${p.status === "request" ? `<p class="muted">Este app é de uso restrito. Peça acesso por e-mail: quando o pedido for aprovado, você recebe o arquivo.</p>` : ""}`;
  return `<div class="card dl-card ${mine ? "mine" : ""}">
    ${mine ? `<span class="mine-tag">Seu sistema</span>` : ""}
    <div class="plat">${ico(PLATFORM_ICON[key])}<h3>${label}</h3></div>
    ${details}
    ${button}
  </div>`;
}

function viaLauncher() {
  return `<div class="card via-launcher" style="margin-top:16px;--tint:${APPS.launcher.tint}">
    <span class="app-tile">${ico("logo")}</span>
    <div><h3 style="font-size:1.1rem">Mais fácil: pelo NokyLabs Launcher</h3><p style="color:var(--texto-2)">Instala com um clique, cria os atalhos e avisa quando sair versão nova.</p></div>

}

function installGuide(app) {
  const keys = Object.keys(app.install);
  const first = keys.includes(OS) ? OS : keys[0];
  return `
  <div style="margin-top:28px">
    <h3 style="font-size:1.3rem;margin-bottom:12px">${app.isGame || app.isWeb ? "Como começar" : "Instalação passo a passo"}</h3>
    ${keys.length > 1 ? `<div class="inst-tabs" role="tablist">${keys.map(k => `<button data-inst="${k}" class="${k === first ? "on" : ""}">${ico(PLATFORM_ICON[k])}${PLATFORM_LABEL[k]}</button>`).join("")}</div>` : ""}
    ${keys.map(k => `<ol class="steps" data-inst-panel="${k}" ${k === first ? "" : "hidden"}>${app.install[k].map(([t, d]) => `<li><div><h3>${t}</h3><p>${formatCmd(d)}</p></div></li>`).join("")}</ol>`).join("")}
  </div>`;
}

const formatCmd = d => esc(d).replace(/(chmod \+x [\w.-]+|\.\/NokyLabs)/g, "<code>$1</code>");

function setupContact() {
  const $ = id => document.getElementById(id);
  if (contactPreset) { $("fApp").value = contactPreset; contactPreset = null; }

  const build = () => {
    const kind = document.querySelector('input[name="kind"]:checked').value;
    const appKey = $("fApp").value;
    const app = APPS[appKey];
    const appName = app ? app.name + (app.subtitle ? " " + app.subtitle : "") : "Geral / site";
    const isBug = kind === "Bug";
    document.querySelectorAll("[data-bug-only]").forEach(el => el.hidden = !isBug);

    const lines = [
      `Tipo: ${kind}`,
      `App: ${appName}`,
      `Versão: ${$("fVer").value.trim() || "não informada"}`,
      `Sistema: ${$("fOs").value.trim() || "não informado"}`,
      "",
      "O que aconteceu:",
      $("fWhat").value.trim() || "(descreva aqui)",
    ];
    if (isBug) {
      lines.push("", "Como reproduzir:", $("fSteps").value.trim() || "(passos aqui)");
      lines.push("", "Resultado esperado:", $("fExpected").value.trim() || "(o que deveria acontecer)");
    }
    const body = lines.join("\n");
    const subject = `[NokyLabs] ${kind} · ${appName}`;
    $("preview").textContent = `Assunto: ${subject}\n\n${body}`;
    $("mailReport").href = `mailto:${SITE.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

    const gh = $("ghReport");
    if (app && app.repoPublic) {
      gh.hidden = false;
      gh.href = `${repoUrl(app)}/issues/new?title=${encodeURIComponent(`${kind}: ${($("fWhat").value.trim().split("\n")[0] || appName).slice(0, 80)}`)}&body=${encodeURIComponent(body)}`;
    } else {
      gh.hidden = true;
    }
    $("copyReport").dataset.text = `Assunto: ${subject}\n\n${body}`;
  };

  $("reportForm").addEventListener("input", build);
  $("reportForm").addEventListener("change", build);
  $("reportForm").addEventListener("submit", e => e.preventDefault());
  $("copyReport").addEventListener("click", e => copyText(e.currentTarget.dataset.text, "Relatório copiado", $("preview")));
  $("copyMail").addEventListener("click", () => copyText(SITE.email, "E-mail copiado", $("mailAddr")));
  build();
}

const semMovimento = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const BLOCOS = ".hero, .app-hero, .section-head, .card, .steps > li, .timeline > li, .faq details, .faq-tools, .table-scroll, .shot, .filters, .inst-tabs, .os-note, .callout, .about-grid";

/* Entrada em sequência: cada bloco visível sobe 10px e aparece, um a cada 45ms (até 16) */
function animar(raiz, jaPassou = 0) {
  if (!raiz || semMovimento()) return;
  let i = 0;
  raiz.querySelectorAll(BLOCOS).forEach(el => {
    if (i >= 16 || el.closest("[hidden]") || el.parentElement.closest(".entra")) return;
    // jaPassou: quando a página é redesenhada no meio da entrada, a animação continua de onde estava
    el.style.animationDelay = (i++ * 45 - jaPassou) + "ms";
    el.classList.add("entra");
    el.addEventListener("animationend", e => {
      if (e.target !== el) return;
      el.classList.remove("entra"); el.style.animationDelay = "";
    });
  });
  if (!jaPassou) contar(raiz);
}

/* Números que contam de 0 até o valor em .75s, desacelerando */
function contar(raiz) {
  raiz.querySelectorAll("[data-conta]").forEach(el => {
    if (el.closest("[hidden]")) return;
    const alvo = +el.dataset.conta, t0 = performance.now();
    const passo = agora => {
      const k = Math.min(1, (agora - t0) / 750);
      el.textContent = Math.round(alvo * (1 - Math.pow(1 - k, 3))) + "%";
      if (k < 1) requestAnimationFrame(passo);
    };
    requestAnimationFrame(passo);
  });
}

/* Brilho que segue o mouse nos cartões clicáveis (o CSS lê --mx e --my) */
document.addEventListener("pointermove", e => {
  const cartao = e.target.closest?.(".app-card, .cat-card");
  if (!cartao) return;
  const r = cartao.getBoundingClientRect();
  cartao.style.setProperty("--mx", (e.clientX - r.left) + "px");
  cartao.style.setProperty("--my", (e.clientY - r.top) + "px");
}, { passive: true });

let currentTab = null;
let inicioEntrada = 0;
function render(entrada = true) {
  const [key, tab] = (location.hash || "#home").slice(1).split("/");
  currentTab = tab || null;
  const route = ROUTES[key] || ROUTES.home;
  nav.innerHTML = NAV.map(([k, l]) => `<a href="#${k}" ${route.nav === k ? 'aria-current="page"' : ""}>${l}</a>`).join("");
  main.innerHTML = `<div class="page">${route.render()}</div>`;
  if (entrada) { inicioEntrada = performance.now(); animar(main); }
  else if (performance.now() - inicioEntrada < 1200) animar(main, performance.now() - inicioEntrada);
  document.title = route.title === "NokyLabs" ? "NokyLabs" : `${route.title} · NokyLabs`;
  nav.classList.remove("open");
  menuBtn.setAttribute("aria-expanded", "false");
  if (entrada) window.scrollTo({ top: 0, behavior: "auto" });
  wirePage(key);
}
// O link "Pular para o conteúdo" não pode mexer no endereço (a rota fica em #): só leva o foco para o conteúdo
document.getElementById("skipLink").addEventListener("click", e => { e.preventDefault(); main.focus(); main.scrollIntoView(); });

function wirePage(key) {
  // Abas da página de um app: mostra só a aba escolhida
  window.onscroll = null;
  const tabBar = main.querySelector(".tabs");
  const showTab = id => {
    if (!main.querySelector(`[data-panel="${id}"]`)) return;
    main.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== id);
    animar(main.querySelector(`[data-panel="${id}"]`));
    main.querySelectorAll(".tabs button").forEach(b => {
      const on = b.dataset.jump === id;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", on);
    });
    currentTab = id;
    history.replaceState(null, "", "#" + key + (id === "visao" ? "" : "/" + id));
    // Se a pessoa já desceu a página, volta para o começo das abas
    if (tabBar) {
      const hero = tabBar.previousElementSibling;   // a aba "gruda" no topo logo depois do cabeçalho do app
      const stick = hero.getBoundingClientRect().bottom + window.scrollY + 28 - 66;
      if (window.scrollY > stick) window.scrollTo({ top: stick, behavior: "auto" });
    }
  };
  main.querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => showTab(b.dataset.jump)));

  // Guia de instalação por sistema
  main.querySelectorAll("[data-inst]").forEach(b => b.addEventListener("click", () => {
    main.querySelectorAll("[data-inst]").forEach(x => x.classList.toggle("on", x === b));
    main.querySelectorAll("[data-inst-panel]").forEach(p => p.hidden = p.dataset.instPanel !== b.dataset.inst);
    animar(main.querySelector(`[data-inst-panel="${b.dataset.inst}"]`));
  }));

  // Busca nas dúvidas
  const search = document.getElementById("faqSearch");
  if (search) search.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    let shown = 0;
    document.querySelectorAll("#faqList details").forEach(d => {
      const hit = !q || d.textContent.toLowerCase().includes(q);
      d.hidden = !hit; if (hit) shown++;
      if (q && hit) d.open = true;
    });
    document.getElementById("faqEmpty").hidden = shown > 0;
  });

  // "Falar sobre este app" abre o contato já com o app escolhido
  main.querySelectorAll("[data-contact]").forEach(b => b.addEventListener("click", () => {
    contactPreset = b.dataset.contact;
    location.hash = "contato";
  }));

  // Filtro das novidades
  const filters = document.getElementById("newsFilters");
  if (filters) filters.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    filters.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll("#newsList li").forEach(li => li.hidden = b.dataset.filter !== "all" && li.dataset.app !== b.dataset.filter);
  });

  if (key === "contato") setupContact();
  startMock();
}

/* Animação do card "YT-DLP GUI" no mockup: Instalar → progresso → Abrir */
function startMock() {
  clearInterval(mockTimer);
  const card = document.getElementById("mockInstall");
  if (!card || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const badge = card.querySelector("[data-badge]"), ver = card.querySelector("[data-ver]"), act = card.querySelector("[data-act]");
  if (!badge || !ver || !act) return;
  let t = 0;
  mockTimer = setInterval(() => {
    t = (t + 1) % 70;
    if (t === 12) { act.className = "act wait"; act.textContent = "Aguarde…"; ver.innerHTML = '<span class="bar"><i></i></span>'; }
    if (t > 12 && t <= 37) { const bar = ver.querySelector("i"); if (bar) bar.style.width = ((t - 12) * 4) + "%"; }
    if (t === 38) {
      act.className = "act open"; act.textContent = "Abrir"; ver.textContent = "v9 · em dia";
      badge.textContent = "Instalado"; badge.style.cssText = "background:rgba(52,211,153,.14);color:#34D399";
    }
    if (t === 0) {
      act.className = "act inst"; act.textContent = "Instalar"; ver.textContent = "v9 disponível";
      badge.textContent = "Disponível"; badge.style.cssText = "background:rgba(139,92,246,.16);color:#C4B5FD";
    }
  }, 100);
}

/* Copiar com plano B (seleciona o texto se a área de transferência recusar) */
function copyText(text, okMsg, fallbackEl) {
  const done = () => toast(okMsg);
  const fallback = () => {
    if (fallbackEl) {
      const range = document.createRange(); range.selectNodeContents(fallbackEl);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    }
    toast("Texto selecionado: use Ctrl+C para copiar");
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  } catch { fallback(); }
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

/* Tema: segue o sistema até a pessoa escolher; a escolha fica salva neste navegador.
   No <html>, data-tema="claro" ou "escuro" (os mesmos nomes do ValReport). */
const themeBtn = document.getElementById("themeBtn");
const raizTema = document.documentElement;
function currentTheme() {
  const set = raizTema.dataset.tema;
  if (set === "escuro" || set === "claro") return set;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
}
function paintThemeBtn() {
  const escuro = currentTheme() === "escuro";
  themeBtn.innerHTML = ico(escuro ? "sun" : "moon");
  themeBtn.setAttribute("aria-label", escuro ? "Mudar para o tema claro" : "Mudar para o tema escuro");
  // A barra do navegador no celular acompanha o fundo do tema escolhido
  const fundo = getComputedStyle(raizTema).getPropertyValue("--fundo").trim();
  if (fundo) document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute("content", fundo));
}
themeBtn.addEventListener("click", () => {
  const novo = currentTheme() === "escuro" ? "claro" : "escuro";
  const aplicar = () => { raizTema.dataset.tema = novo; paintThemeBtn(); };
  try { localStorage.setItem("nokylabs-tema", novo); } catch {}
  if (semMovimento()) return aplicar();
  if (document.startViewTransition) {
    // Um círculo se abre a partir do botão
    const r = themeBtn.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    raizTema.style.setProperty("--tx", x + "px");
    raizTema.style.setProperty("--ty", y + "px");
    raizTema.style.setProperty("--tr", Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + "px");
    document.startViewTransition(aplicar);
  } else {
    // Sem suporte: as cores se misturam em .35s
    raizTema.classList.add("trocando-tema");
    aplicar();
    setTimeout(() => raizTema.classList.remove("trocando-tema"), 400);
  }
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", paintThemeBtn);

menuBtn.addEventListener("click", () => {
  const open = nav.classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", String(open));

/* =====================================================================
   CATÁLOGO: versões, links, tamanhos e novidades vêm do catalogo.json,
   o mesmo arquivo que o NokyLabs Launcher lê (mantido em dia pelo robô
   do catálogo). O que está escrito em APPS fica como reserva, caso o
   arquivo não carregue. Assim, lançar uma versão não exige editar o site.
   ===================================================================== */
const CATALOG_ID = { ytdlp: "ytdlp-gui" };

function applyCatalog(cat) {
  let mudou = false;
  for (const app of Object.values(APPS)) {
    const c = app.id === "launcher" ? cat.launcher
      : (cat.apps || []).find(a => a.id === (CATALOG_ID[app.id] || app.id));
    if (!c) continue;
    if (c.requestAccess) {
      // Uso restrito: nada de download, só o pedido de acesso.
      app.requestAccess = c.requestAccess;
      for (const p of Object.values(app.platforms || {})) if (p.status !== "none") p.status = "request";
      mudou = true;
      continue;
    }
    if (!c.downloads) continue;
    let publicado = false;
    for (const [key, d] of Object.entries(c.downloads)) {
      const p = app.platforms?.[key];
      if (!p || !d || !d.published || !d.url) continue;
      publicado = true;
      p.status = "available";
      p.url = d.url;
      p.file = d.url.split("/").pop();
      if (d.size) p.size = fmtSize(d.size) + (p.sizeNote ? " " + p.sizeNote : "");
      mudou = true;
    }
    if (publicado && c.version) app.version = c.version;
    if (publicado && c.notes) app.notes = c.notes;
  }
  return mudou;
}

fetch("catalogo.json", { cache: "no-cache" })
  .then(r => (r.ok ? r.json() : null))
  .then(cat => {
    if (!cat || !applyCatalog(cat)) return;
    render(false);   // só troca os dados: sem repetir a animação nem mexer na rolagem
  })
  .catch(() => { /* sem catálogo: o site usa os valores escritos em APPS */ });
</script>
